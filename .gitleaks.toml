[extend]
useDefault = true

[[allowlists]]
description = "Generated dependencies and Next.js build output"
paths = [
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
]

[[allowlists]]
description = "Public 20-byte EVM addresses are not credentials"
regexTarget = "match"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
]
