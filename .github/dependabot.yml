version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: Europe/London
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    versioning-strategy: increase
    labels:
      - dependencies
      - security-review-required
    commit-message:
      prefix: deps(app)

  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
      day: monday
      time: "04:47"
      timezone: Europe/London
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    versioning-strategy: increase
    labels:
      - dependencies
      - security-review-required
    commit-message:
      prefix: deps(contracts)
