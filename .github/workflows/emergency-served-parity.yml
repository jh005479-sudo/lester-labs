name: Independent emergency containment parity

on:
  workflow_call:
    inputs:
      reviewed_commit:
        description: Exact emergency source commit on protected main
        required: true
        type: string
      promotion_run_id:
        description: Exact Vercel production workflow run containing signed promotion evidence
        required: true
        type: string
      promotion_run_attempt:
        description: Exact Vercel production workflow run attempt containing signed promotion evidence
        required: true
        type: number
      release_profile:
        description: Explicit authority and parity profile
        required: true
        type: string
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: Exact emergency source commit on protected main
        required: true
        type: string
      promotion_run_id:
        description: Exact Vercel production workflow run containing signed promotion evidence
        required: true
        type: string
      promotion_run_attempt:
        description: Exact Vercel production workflow run attempt containing signed promotion evidence
        required: true
        type: number
      release_profile:
        description: Explicit authority and parity profile
        required: true
        type: choice
        options:
          - production-separated-authority
          - public-testnet-immutable

permissions:
  contents: read

concurrency:
  group: emergency-served-parity-${{ inputs.release_profile }}-${{ inputs.reviewed_commit }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: Validate dispatch before isolated network vantages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      reviewed_commit: ${{ steps.validate.outputs.reviewed_commit }}
      promotion_run_id: ${{ steps.validate.outputs.promotion_run_id }}
      promotion_run_attempt: ${{ steps.validate.outputs.promotion_run_attempt }}
      release_profile: ${{ steps.validate.outputs.release_profile }}
      verification_profile: ${{ steps.validate.outputs.verification_profile }}
      vantage_a_id: ${{ steps.validate.outputs.vantage_a_id }}
      vantage_b_id: ${{ steps.validate.outputs.vantage_b_id }}
    steps:
      - name: Validate protected source and promotion workflow identity
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
          PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          PROMOTION_RUN_ATTEMPT: ${{ inputs.promotion_run_attempt }}
          RELEASE_PROFILE: ${{ inputs.release_profile }}
          PROTECTED_REF: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROMOTION_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$PROMOTION_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,5}$ ]]
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PROTECTED_REF" = "true"
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          case "$RELEASE_PROFILE" in
            production-separated-authority)
              verification_profile="production-independent-network"
              vantage_a_id="protected-eu-network"
              vantage_b_id="protected-us-network"
              ;;
            public-testnet-immutable)
              verification_profile="public-testnet-github-hosted"
              vantage_a_id="github-hosted-a"
              vantage_b_id="github-hosted-b"
              ;;
            *) exit 1 ;;
          esac
          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$PROMOTION_RUN_ID" \
            > "$RUNNER_TEMP/promotion-run.json"
          node --input-type=module - "$RUNNER_TEMP/promotion-run.json" "$REVIEWED_COMMIT" "$PROMOTION_RUN_ATTEMPT" <<'NODE'
          import { readFileSync } from "node:fs";
          const [path, commit, attempt] = process.argv.slice(2);
          const run = JSON.parse(readFileSync(path, "utf8"));
          if (
            run.head_sha !== commit ||
            run.head_branch !== "main" ||
            run.event !== "workflow_dispatch" ||
            !["queued", "in_progress", "completed"].includes(run.status) ||
            run.run_attempt !== Number(attempt) ||
            run.path !== ".github/workflows/vercel-production-release.yml"
          ) throw new Error("Promotion run is not the exact reviewed Vercel production workflow and commit.");
          NODE
          printf 'reviewed_commit=%s\n' "$REVIEWED_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'promotion_run_id=%s\n' "$PROMOTION_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'promotion_run_attempt=%s\n' "$PROMOTION_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'release_profile=%s\n' "$RELEASE_PROFILE" >> "$GITHUB_OUTPUT"
          printf 'verification_profile=%s\n' "$verification_profile" >> "$GITHUB_OUTPUT"
          printf 'vantage_a_id=%s\n' "$vantage_a_id" >> "$GITHUB_OUTPUT"
          printf 'vantage_b_id=%s\n' "$vantage_b_id" >> "$GITHUB_OUTPUT"

  vantage-eu:
    name: Wallet-free EU emergency vantage
    needs: validate-inputs
    runs-on: ${{ needs.validate-inputs.outputs.release_profile == 'public-testnet-immutable' && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted","linux","x64","lester-vantage-eu"]') }}
    environment: ${{ needs.validate-inputs.outputs.release_profile == 'public-testnet-immutable' && 'frontend-public-testnet-vantage-a' || 'frontend-vantage-eu' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact reviewed emergency verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-inputs.outputs.reviewed_commit }}
          persist-credentials: false

      - name: Use exact reviewed Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          check-latest: false
          package-manager-cache: false

      - name: Enforce credential-free fixed-vantage prerequisites
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ needs.validate-inputs.outputs.reviewed_commit }}
          PROTECTED_REF: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PROTECTED_REF" = "true"
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(uname -m)" = "x86_64"
          test "$(node --version)" = "v24.18.0"
          command -v gh >/dev/null

      - name: Download exact signed emergency promotion
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: vercel-promotion-emergency-static-${{ needs.validate-inputs.outputs.reviewed_commit }}-${{ needs.validate-inputs.outputs.promotion_run_id }}-${{ needs.validate-inputs.outputs.promotion_run_attempt }}
          path: ${{ runner.temp }}/promotion
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-inputs.outputs.promotion_run_id }}
          github-token: ${{ github.token }}

      - name: Verify signed promotion and apex/www from EU without wallet or hosting credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ needs.validate-inputs.outputs.reviewed_commit }}
        run: |
          set -euo pipefail
          source scripts/security/use-reviewed-gh.sh
          mkdir -p "$GITHUB_WORKSPACE/emergency-parity-evidence"
          bash scripts/security/verify-gh-attestation-with-retry.sh "$RUNNER_TEMP/promotion/promotion-evidence.json" \
            --repo jh005479-sudo/lester-labs \
            --bundle "$RUNNER_TEMP/promotion/promotion-evidence.provenance.jsonl" \
            --signer-workflow github.com/jh005479-sudo/lester-labs/.github/workflows/vercel-production-release.yml \
            --source-ref refs/heads/main --source-digest "$REVIEWED_COMMIT" \
            --signer-digest "$REVIEWED_COMMIT" --deny-self-hosted-runners --format json | \
          env -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
          node scripts/security/verify-emergency-served-parity.mjs production \
            --promotion-evidence "$RUNNER_TEMP/promotion/promotion-evidence.json" \
            --promotion-provenance "$RUNNER_TEMP/promotion/promotion-evidence.provenance.jsonl" \
            --promotion-verification - \
            --expected-source-commit "$REVIEWED_COMMIT" \
            --vantage-id "${{ needs.validate-inputs.outputs.vantage_a_id }}" \
            --verification-profile "${{ needs.validate-inputs.outputs.verification_profile }}" \
            --origin https://lester-labs.com \
            --origin https://www.lester-labs.com \
            --source-dir emergency-site \
            --output emergency-parity-evidence/vantage-eu.json

      - name: Sign EU emergency parity
        id: eu-provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: emergency-parity-evidence/vantage-eu.json

      - name: Preserve EU provenance
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.eu-provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$PROVENANCE_BUNDLE"
          cp -- "$PROVENANCE_BUNDLE" emergency-parity-evidence/vantage-eu.provenance.jsonl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emergency-parity-eu-${{ needs.validate-inputs.outputs.reviewed_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: emergency-parity-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  vantage-us:
    name: Wallet-free US emergency vantage
    needs: validate-inputs
    runs-on: ${{ needs.validate-inputs.outputs.release_profile == 'public-testnet-immutable' && fromJSON('["ubuntu-24.04"]') || fromJSON('["self-hosted","linux","x64","lester-vantage-us"]') }}
    environment: ${{ needs.validate-inputs.outputs.release_profile == 'public-testnet-immutable' && 'frontend-public-testnet-vantage-b' || 'frontend-vantage-us' }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact reviewed emergency verifier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-inputs.outputs.reviewed_commit }}
          persist-credentials: false

      - name: Use exact reviewed Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          check-latest: false
          package-manager-cache: false

      - name: Enforce credential-free fixed-vantage prerequisites
        shell: bash
        env:
          REVIEWED_COMMIT: ${{ needs.validate-inputs.outputs.reviewed_commit }}
          PROTECTED_REF: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$PROTECTED_REF" = "true"
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(uname -m)" = "x86_64"
          test "$(node --version)" = "v24.18.0"
          command -v gh >/dev/null

      - name: Download exact signed emergency promotion
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: vercel-promotion-emergency-static-${{ needs.validate-inputs.outputs.reviewed_commit }}-${{ needs.validate-inputs.outputs.promotion_run_id }}-${{ needs.validate-inputs.outputs.promotion_run_attempt }}
          path: ${{ runner.temp }}/promotion
          repository: ${{ github.repository }}
          run-id: ${{ needs.validate-inputs.outputs.promotion_run_id }}
          github-token: ${{ github.token }}

      - name: Verify signed promotion and apex/www from US without wallet or hosting credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ needs.validate-inputs.outputs.reviewed_commit }}
        run: |
          set -euo pipefail
          source scripts/security/use-reviewed-gh.sh
          mkdir -p "$GITHUB_WORKSPACE/emergency-parity-evidence"
          bash scripts/security/verify-gh-attestation-with-retry.sh "$RUNNER_TEMP/promotion/promotion-evidence.json" \
            --repo jh005479-sudo/lester-labs \
            --bundle "$RUNNER_TEMP/promotion/promotion-evidence.provenance.jsonl" \
            --signer-workflow github.com/jh005479-sudo/lester-labs/.github/workflows/vercel-production-release.yml \
            --source-ref refs/heads/main --source-digest "$REVIEWED_COMMIT" \
            --signer-digest "$REVIEWED_COMMIT" --deny-self-hosted-runners --format json | \
          env -u GH_TOKEN -u GITHUB_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
          node scripts/security/verify-emergency-served-parity.mjs production \
            --promotion-evidence "$RUNNER_TEMP/promotion/promotion-evidence.json" \
            --promotion-provenance "$RUNNER_TEMP/promotion/promotion-evidence.provenance.jsonl" \
            --promotion-verification - \
            --expected-source-commit "$REVIEWED_COMMIT" \
            --vantage-id "${{ needs.validate-inputs.outputs.vantage_b_id }}" \
            --verification-profile "${{ needs.validate-inputs.outputs.verification_profile }}" \
            --origin https://lester-labs.com \
            --origin https://www.lester-labs.com \
            --source-dir emergency-site \
            --output emergency-parity-evidence/vantage-us.json

      - name: Sign US emergency parity
        id: us-provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: emergency-parity-evidence/vantage-us.json

      - name: Preserve US provenance
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.us-provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$PROVENANCE_BUNDLE"
          cp -- "$PROVENANCE_BUNDLE" emergency-parity-evidence/vantage-us.provenance.jsonl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emergency-parity-us-${{ needs.validate-inputs.outputs.reviewed_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: emergency-parity-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  compare-signed-vantages:
    name: Verify and compare independent emergency vantages
    needs: [validate-inputs, vantage-eu, vantage-us]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact reviewed comparator
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate-inputs.outputs.reviewed_commit }}
          persist-credentials: false

      - name: Use exact reviewed Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          check-latest: false
          package-manager-cache: false

      - name: Download both signed vantage packages
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: emergency-parity-*-${{ needs.validate-inputs.outputs.reviewed_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vantages
          merge-multiple: true

      - name: Verify fixed-vantage signatures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_COMMIT: ${{ needs.validate-inputs.outputs.reviewed_commit }}
        run: |
          set -euo pipefail
          source scripts/security/use-reviewed-gh.sh
          test "$GITHUB_SHA" = "$REVIEWED_COMMIT"
          for vantage in eu us; do
            bash scripts/security/verify-gh-attestation-with-retry.sh "$RUNNER_TEMP/vantages/vantage-$vantage.json" \
              --repo jh005479-sudo/lester-labs \
              --bundle "$RUNNER_TEMP/vantages/vantage-$vantage.provenance.jsonl" \
              --signer-workflow github.com/jh005479-sudo/lester-labs/.github/workflows/emergency-served-parity.yml \
              --source-ref refs/heads/main --source-digest "$REVIEWED_COMMIT" \
              --signer-digest "$REVIEWED_COMMIT" --format json >/dev/null
          done

      - name: Compare exact signed results
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/emergency-parity-comparison"
          node scripts/security/verify-emergency-served-parity.mjs compare \
            "$RUNNER_TEMP/vantages/vantage-eu.json" \
            "$RUNNER_TEMP/vantages/vantage-us.json" \
            > emergency-parity-comparison/independent-vantage-comparison.json

      - name: Sign independent comparison
        id: comparison-provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: emergency-parity-comparison/independent-vantage-comparison.json

      - name: Preserve comparison provenance
        shell: bash
        env:
          PROVENANCE_BUNDLE: ${{ steps.comparison-provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -f "$PROVENANCE_BUNDLE"
          cp -- "$PROVENANCE_BUNDLE" emergency-parity-comparison/independent-vantage-comparison.provenance.jsonl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emergency-parity-comparison-${{ needs.validate-inputs.outputs.reviewed_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: emergency-parity-comparison/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
