name: Supply-chain and test verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Immutable install, audit, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "true"
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          check-latest: false
          package-manager-cache: false

      - name: Verify runtime and repository policy pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"
          node scripts/security/verify-package-policy.mjs

      - name: Scan worktree and Git history for committed secrets
        run: node scripts/security/scan-secrets.mjs

      - name: Verify the wallet-free emergency containment artifact
        run: npm run security:emergency-containment

      - name: Install application dependencies immutably
        run: npm ci --ignore-scripts

      - name: Verify public replacement manifest gate
        run: npm run security:public-manifest

      - name: Install contract dependencies immutably
        working-directory: contracts
        run: npm ci --ignore-scripts

      - name: Audit application dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Verify application registry signatures
        run: npm audit signatures

      - name: Audit contract dependency vulnerabilities
        working-directory: contracts
        run: npm audit --audit-level=high

      - name: Verify contract registry signatures
        working-directory: contracts
        run: npm audit signatures

      - name: Lint application source
        run: npm run lint

      - name: Run application unit tests
        run: npm run test:unit

      - name: Build the production application
        env:
          LESTER_RELEASE_BUILD_ID: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$LESTER_RELEASE_BUILD_ID" = "$GITHUB_SHA"
          test "$(git rev-parse --verify HEAD)" = "$LESTER_RELEASE_BUILD_ID"
          [[ "$LESTER_RELEASE_BUILD_ID" =~ ^[0-9a-f]{40}$ ]]
          npm run build

      - name: Test browser journeys with the runner's installed Chromium
        env:
          LESTER_RELEASE_BUILD_ID: ${{ github.sha }}
          BROWSER_TEST_URL: http://127.0.0.1:3100
          CHROMIUM_PATH: /usr/bin/google-chrome
        shell: bash
        run: |
          set -euo pipefail
          test -x "$CHROMIUM_PATH"
          "$CHROMIUM_PATH" --version
          npm run start -- --hostname 127.0.0.1 --port 3100 > /tmp/lester-browser-server.log 2>&1 &
          lester_server_pid=$!
          trap 'kill "$lester_server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/projects > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser

      - name: Run contract tests
        working-directory: contracts
        run: npm test
