<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title description">
  <title id="title">LitVM validity-rollup architecture</title>
  <desc id="description">Transactions move from users to the LitVM execution layer, then through proof generation and Ethereum settlement.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101b31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1l10 5-10 5z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="32" fill="url(#background)"/>
  <text x="70" y="88" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="36" font-weight="700">How LitVM settles transactions</text>
  <text x="70" y="126" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20">A simplified validity-rollup data flow</text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="70" y="220" width="240" height="190" rx="24" fill="#0f2740" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="190" cy="276" r="25" fill="#38bdf8" opacity="0.2"/>
    <path d="M178 276h24M190 264v24" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
    <text x="190" y="338" fill="#f8fafc" font-size="25" font-weight="700">Users &amp; apps</text>
    <text x="190" y="374" fill="#94a3b8" font-size="17">Submit signed transactions</text>

    <rect x="480" y="190" width="240" height="250" rx="24" fill="#18203a" stroke="url(#accent)" stroke-width="3"/>
    <rect x="535" y="236" width="130" height="70" rx="12" fill="#a78bfa" opacity="0.18"/>
    <path d="M555 271h90M575 251v40M625 251v40" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
    <text x="600" y="348" fill="#f8fafc" font-size="25" font-weight="700">LitVM</text>
    <text x="600" y="382" fill="#cbd5e1" font-size="17">EVM execution &amp; batching</text>
    <text x="600" y="409" fill="#94a3b8" font-size="15">LiteForge public testnet</text>

    <rect x="890" y="220" width="240" height="190" rx="24" fill="#211c3d" stroke="#a78bfa" stroke-width="2"/>
    <path d="M980 286l30-18 30 18v36l-30 18-30-18z" fill="#a78bfa" opacity="0.22" stroke="#c4b5fd" stroke-width="3"/>
    <text x="1010" y="365" fill="#f8fafc" font-size="25" font-weight="700">Ethereum</text>
    <text x="1010" y="394" fill="#94a3b8" font-size="17">Proof verification &amp; settlement</text>
  </g>

  <path d="M326 315h132" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M742 315h126" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="392" y="291" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">transactions</text>
  <text x="805" y="291" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">validity proofs</text>

  <rect x="180" y="508" width="840" height="62" rx="20" fill="#0b1729" stroke="#334155"/>
  <text x="600" y="547" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">Execution happens on LitVM; validity proofs anchor the resulting state to Ethereum.</text>
</svg>
